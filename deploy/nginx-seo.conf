# SEO rules for the existing thesincerity.in HTTPS server block.
# Keep its root, TLS, compression, and hashed-asset cache configuration.
# The HTTP server redirects to https://thesincerity.in$request_uri.
if ($host = www.thesincerity.in) {
    return 301 https://thesincerity.in$request_uri;
}
if ($request_uri ~ "^(.*/)index\.html(?:\?.*)?$") {
    return 301 https://thesincerity.in$1$is_args$args;
}
error_page 404 /404.html;
location = /404.html {
    add_header X-Robots-Tag "noindex, follow" always;
}
location = /products/optimedicate/ { return 301 https://thesincerity.in/products/optimedicare/; }
location = /products/optimedicate { return 301 https://thesincerity.in/products/optimedicare/; }
location = /explore/ { return 301 https://thesincerity.in/; }
location = /explore { return 301 https://thesincerity.in/; }
location / {
    try_files $uri $uri/ =404;
}
